 spring.application.name=Emergency Resource Network

server.port=${PORT:8080}
server.forward-headers-strategy=framework

#spring.datasource.url=jdbc:postgresql://localhost:5432/emergency_network
#spring.datasource.username=postgres
#spring.datasource.password=Postgres123
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emergency_network}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
